<meta name="claude:viewport-fit-sides" content="cover">
<title>Year One</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, three tabs. Quiet Apple neutrals; colour only arrives as gradient blocks (one per pillar) and as the reward state of a finished card. */
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --ink:#0B0B0F; --ink2:#6E6E73; --ink3:#A1A1A6;
  --line:rgba(0,0,0,.08); --fill:rgba(118,118,128,.12); --shadow:0 1px 2px rgba(0,0,0,.04);
  --c-strength:#FF3B30; --c-ride:#12A150; --c-mind:#7A4DFF; --c-fuel:#0A84FF;
  --g-strength:linear-gradient(135deg,#FF6A1A 0%,#FF1F6B 100%);
  --g-ride:linear-gradient(135deg,#DFFF3D 0%,#3DF2A8 100%);
  --g-mind:linear-gradient(135deg,#5B5BFF 0%,#B84DFF 100%);
  --g-fuel:linear-gradient(135deg,#1FD1FF 0%,#1F5BFF 100%);
  --g-night:linear-gradient(160deg,#0B1030 0%,#2A1766 60%,#5B2A8C 100%);
  --fg:var(--ink); --inv:var(--card); --soft:var(--fill); --mute:var(--ink2);
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --ink:#F5F5F7; --ink2:#98989F; --ink3:#636366;
  --line:rgba(255,255,255,.1); --fill:rgba(118,118,128,.26); --shadow:none;
  --c-strength:#FF5247; --c-ride:#C8FF3D; --c-mind:#A07BFF; --c-fuel:#3DA5FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --ink:#F5F5F7; --ink2:#98989F; --ink3:#636366;
  --line:rgba(255,255,255,.1); --fill:rgba(118,118,128,.26); --shadow:none;
  --c-strength:#FF5247; --c-ride:#C8FF3D; --c-mind:#A07BFF; --c-fuel:#3DA5FF; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(96px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c-fuel);outline-offset:2px}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.d{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.005em;line-height:.9}
.eyebrow{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-size:13px}
.mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}

/* gradient blocks */
.g-strength{background:var(--g-strength);--fg:#fff;--inv:#B3123F}
.g-mind{background:var(--g-mind);--fg:#fff;--inv:#4A2FD1}
.g-fuel{background:var(--g-fuel);--fg:#fff;--inv:#0F47C9}
.g-night{background:var(--g-night);--fg:#fff;--inv:#2A1766}
.g-ride{background:var(--g-ride);--fg:#0B0B0F;--inv:#DFFF3D}
.g-ink{background:var(--ink);--fg:var(--bg);--inv:var(--ink)}
.g-strength,.g-mind,.g-fuel,.g-night,.g-ride,.g-ink{color:var(--fg);--soft:color-mix(in srgb,var(--fg) 17%,transparent);--mute:color-mix(in srgb,var(--fg) 74%,transparent);--line:color-mix(in srgb,var(--fg) 22%,transparent)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 0}
.top .d{font-size:22px}
.top .d span{color:var(--ink3)}
.icon{width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.icon svg{width:20px;height:20px}

/* hero */
.hero{border-radius:28px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero h1{margin:0;font-size:clamp(46px,14.5vw,68px);text-wrap:balance}
.hero p{margin:0;font-size:14px;color:var(--mute);max-width:38ch}
.pill{height:30px;padding:0 12px;border-radius:999px;background:var(--soft);font-family:var(--display);font-weight:700;letter-spacing:.08em;font-size:13px;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hero .foot{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.ring{width:46px;height:46px;flex:none}
.foot b{font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;text-transform:uppercase;display:block;line-height:1}
.foot small{font-size:12.5px;color:var(--mute);font-weight:500}
.foot>div{min-width:0}

/* week strip */
.strip{display:flex;align-items:stretch;gap:4px}
.strip .nav{width:26px;color:var(--ink3);font-size:20px;display:grid;place-items:center}
.strip .nav[disabled]{opacity:.25}
.dy{flex:1;min-width:0;border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px}
.dy em{font-style:normal;font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.04em}
.dy b{font-family:var(--display);font-weight:700;font-size:20px;line-height:1}
.dy i{display:block;width:18px;height:4px;border-radius:2px;background:var(--fill);overflow:hidden}
.dy i::after{content:"";display:block;height:100%;width:var(--p,0%);background:var(--c-strength);border-radius:2px}
.dy.sel{background:var(--ink);color:var(--bg)}
.dy.sel em{color:inherit;opacity:.7}
.dy.sel i{background:color-mix(in srgb,var(--bg) 25%,transparent)}
.dy.today:not(.sel) b{color:var(--c-strength)}
.dy.fut{opacity:.32}

/* cards */
.card{background:var(--card);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);color:var(--fg)}
.card.g-strength,.card.g-mind,.card.g-ride,.card.g-ink{box-shadow:none}
.card.g-strength{background:var(--g-strength)}.card.g-mind{background:var(--g-mind)}.card.g-ride{background:var(--g-ride)}.card.g-ink{background:var(--ink)}
.ch{display:flex;align-items:center;gap:12px}
.blk{width:52px;height:52px;border-radius:15px;flex:none;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;letter-spacing:-.01em}
.done .blk{background:var(--soft)}
.ch h3{margin:0;font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:28px;line-height:.95}
.ch p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.ch .grow{flex:1;min-width:0}
.tick{width:30px;height:30px;border-radius:50%;background:var(--fg);color:var(--inv);display:grid;place-items:center;flex:none}
.tick svg{width:16px;height:16px}

.ex{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.exh{display:flex;align-items:center;gap:8px;min-height:28px}
.exh b{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:19px;letter-spacing:.02em;flex:1}
.dots{display:flex;gap:5px;align-items:center;font-size:12px;font-weight:600}
.dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--fg);opacity:.35}
.dots i.on{background:var(--fg);opacity:1}
.undo{width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:17px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;background:var(--soft);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:transform .12s}
.chip:active,.tile:active,.big:active{transform:scale(.96)}
.chip.on{background:var(--fg);color:var(--inv)}
.chip.hold{box-shadow:inset 0 0 0 1.5px var(--line);background:transparent}
.chip.hold.on{background:var(--fg);box-shadow:none}
.chip small{font-size:12px;font-weight:700;opacity:.8}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:3px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{height:38px;border-radius:11px;text-align:center;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:var(--mute)}
.seg button.on{background:var(--fg);color:var(--inv)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{min-height:64px;border-radius:18px;background:var(--soft);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;transition:transform .12s}
.tile b{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:21px;line-height:.95;display:block}
.tile small{font-size:12px;color:var(--mute);font-weight:500}
.tile .o{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.tile .o svg{width:13px;height:13px;opacity:0}
.tile.on{background:var(--fg);color:var(--inv);--mute:color-mix(in srgb,var(--inv) 75%,transparent)}
.tile.on .o{border-color:transparent;background:var(--inv);color:var(--fg)}
.tile.on .o svg{opacity:1}
.card.fuel .tile.on{background:var(--g-fuel);color:#fff;--mute:rgba(255,255,255,.8)}
.card.fuel .tile.on .o{background:#fff;color:#1F5BFF}

.water{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.water .v{font-family:var(--display);font-style:italic;font-weight:800;font-size:60px;line-height:.82}
.water .v small{font-size:22px;color:var(--mute);font-weight:700}
.wbtns{display:flex;gap:8px;align-items:center}
.big{height:48px;padding:0 18px;border-radius:999px;font-family:var(--display);font-style:italic;font-weight:800;font-size:20px;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s;white-space:nowrap}
.big.fuel{background:var(--g-fuel);color:#fff}
.big.ink{background:var(--fg);color:var(--inv)}
.big.soft{background:var(--soft)}
.big.round{width:48px;padding:0}
.glasses{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.glasses button{height:34px;border-radius:8px;background:var(--soft)}
.glasses button.on{background:var(--g-fuel)}
.extras{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:2px 4px}
.extras span{font-size:13px;color:var(--ink2);margin-right:2px}
.extras .chip{background:var(--card);box-shadow:var(--shadow)}

.recap h2{margin:0;font-size:44px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--soft);border-radius:14px;padding:10px 12px}
.stat b{font-family:var(--display);font-style:italic;font-weight:800;font-size:26px;line-height:1;display:block}
.stat small{font-size:11.5px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.rowbtns{display:flex;gap:8px}
.rowbtns .big{flex:1;height:44px;font-size:18px}

/* progress */
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ptitle h2{margin:0;font-size:34px}
.ptitle .nav{width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:20px}
.ptitle .nav[disabled]{opacity:.3}
.score{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.score .v{font-size:84px}
.score .v small{font-size:30px}
.score p{margin:0 0 8px;text-align:right;font-size:13px;color:var(--mute)}
.q{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.q b{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:18px;letter-spacing:.03em}
.q b small{font-family:var(--text);text-transform:none;letter-spacing:0;font-weight:500;font-size:12.5px;color:var(--mute);margin-left:6px}
.q span{font-family:var(--display);font-style:italic;font-weight:800;font-size:22px}
.q .bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.q .bar i{display:block;height:100%;border-radius:4px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:96px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars i{width:100%;border-radius:8px 8px 3px 3px;background:var(--g-strength);min-height:3px}
.bars i.z{background:var(--fill)}
.bars em{font-style:normal;font-size:11px;font-weight:600;color:var(--ink3)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal em{font-style:normal;font-size:11px;font-weight:600;color:var(--ink3);text-align:center}
.cal span{aspect-ratio:1;border-radius:10px;background:var(--fill);display:grid;place-items:center;font-size:12.5px;font-weight:600;position:relative;overflow:hidden;color:var(--ink2)}
.cal span b{position:relative;font-weight:600}
.cal span::before{content:"";position:absolute;inset:0;background:var(--g-strength);opacity:var(--o,0)}
.cal span.hi{color:#fff}
.cal span.now{box-shadow:inset 0 0 0 2px var(--ink)}
.cal span.off{background:transparent;color:var(--ink3)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:2px}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--fill);position:relative;overflow:hidden}
.heat i::before{content:"";position:absolute;inset:0;background:var(--c-strength);opacity:var(--o,0)}
.heat i.now{outline:1.5px solid var(--ink);outline-offset:0}
.track{height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.track i{display:block;height:100%;background:var(--g-strength);border-radius:5px;min-width:10px}
.wchart{width:100%;height:auto;display:block}
.wline{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.wline .v{font-size:52px}
.wline .v small{font-size:20px;color:var(--mute)}

/* flow */
.fhead h2{margin:0;font-size:44px}
.fhead p{margin:4px 0 0;color:var(--ink2);font-size:13.5px}
.dchips{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dchips button{height:40px;border-radius:12px;text-align:center;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.05em;background:var(--fill);color:var(--ink2)}
.dchips button.on{background:var(--ink);color:var(--bg)}
.tl{position:relative;margin-left:44px;user-select:none;-webkit-user-select:none}
.tl .hr{position:absolute;left:-44px;right:0;border-top:1px solid var(--line);height:0}
.tl .hr span{position:absolute;left:0;top:-8px;font-size:11px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums}
.lane{position:absolute;top:0;bottom:0}
.lane.main{left:0;right:86px}
.lane.sip{right:0;width:78px}
.it{position:absolute;border-radius:14px;padding:7px 34px 7px 11px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;cursor:grab;color:var(--fg)}
.it b{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;font-size:18px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{font-size:11.5px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.custom{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}
.it .grip{position:absolute;right:0;top:0;bottom:0;width:34px;display:grid;place-items:center;touch-action:none;cursor:grab;opacity:.7}
.it .grip::before{content:"";width:12px;height:10px;border-top:2px solid currentColor;border-bottom:2px solid currentColor;box-shadow:inset 0 2px 0 0 transparent}
.sipit{position:absolute;left:0;right:0;height:26px;border-radius:13px;background:color-mix(in srgb,var(--c-fuel) 16%,var(--card));color:var(--c-fuel);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;touch-action:none;cursor:grab;font-variant-numeric:tabular-nums}
.sipit::before{content:"";width:7px;height:7px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:currentColor}
.drag{z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.28)!important;cursor:grabbing}
.nowl{position:absolute;left:-8px;right:0;height:2px;background:var(--c-strength);z-index:4;pointer-events:none}
.nowl::before{content:"";position:absolute;left:-3px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--c-strength)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{height:50px;text-align:center;font-family:var(--display);font-style:italic;font-weight:800;font-size:19px;text-transform:uppercase;color:var(--ink3);position:relative}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:50%;bottom:4px;width:26px;height:4px;margin-left:-13px;border-radius:2px;background:var(--g-strength)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim.in{animation:fade .18s}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:28px 28px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.scrim.in .sheet{animation:up .26s cubic-bezier(.2,.9,.3,1)}
.sheet::before{content:"";width:38px;height:5px;border-radius:3px;background:var(--fill);align-self:center;flex:none}
.sheet h2{margin:0;font-size:36px}
.sheet h4{margin:0 0 8px;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-size:13px;color:var(--ink2)}
.sheet p{margin:0;color:var(--ink2);font-size:13.5px}
.field{height:50px;border-radius:14px;background:var(--fill);border:0;padding:0 14px;width:100%;font-size:17px;font-weight:600;min-width:0}
.prow{display:grid;grid-template-columns:86px repeat(7,1fr);gap:4px;align-items:center}
.prow>span{font-size:13px;font-weight:600}
.prow button{height:36px;border-radius:10px;background:var(--fill);text-align:center;font-size:12px;font-weight:700;color:var(--ink3)}
.prow button.on{color:#fff}
.prow.strength button.on{background:var(--g-strength)}.prow.mind button.on{background:var(--g-mind)}.prow.easy button.on,.prow.hard button.on{background:var(--g-ride);color:#0B0B0F}
.prow.plain button.on,.prow.ink button.on{background:var(--ink);color:var(--bg)}
.prow.ride button.on{background:var(--g-ride);color:#0B0B0F}.prow.fuel button.on{background:var(--g-fuel)}
.hrow{width:100%}.chev{font-size:28px;line-height:1;color:var(--ink3);flex:none}
.sws{display:flex;gap:12px;padding:3px}.sw{width:44px;height:44px;border-radius:50%}.sw.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink)}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.line>span{font-weight:600}
.line .field{width:auto;height:44px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font-family:var(--display);font-style:italic;font-weight:800;font-size:26px;min-width:24px;text-align:center}
.exedit{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.exedit .field{height:42px;font-size:14px}
.wbig{display:flex;align-items:center;justify-content:center;gap:14px}
.wbig input{width:170px;text-align:center;background:none;border:0;font-family:var(--display);font-style:italic;font-weight:800;font-size:76px;line-height:1;padding:0;-moz-appearance:textfield}
.wbig input::-webkit-outer-spin-button,.wbig input::-webkit-inner-spin-button{-webkit-appearance:none}
.danger{color:var(--c-strength)}
details summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center;justify-content:space-between}
details summary::after{content:"+";font-size:22px;color:var(--ink3)}
details[open] summary::after{content:"–"}

/* reminder banner + toast */
.ban{position:fixed;z-index:50;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:center;pointer-events:none}
.ban>div{pointer-events:auto;width:100%;max-width:496px;border-radius:22px;padding:14px 14px 14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,.3);animation:down .3s cubic-bezier(.2,.9,.3,1)}

@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const dow=s=>(parse(s).getDay()+6)%7;
const weekStart=s=>addD(s,-dow(s));
const diffD=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const TODAY=()=>ymd(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const t2m=t=>{const a=String(t).split(':').map(Number);return a[0]*60+(a[1]||0)};
const m2t=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const clone=o=>JSON.parse(JSON.stringify(o));
const DN=['MON','TUE','WED','THU','FRI','SAT','SUN'],D1=['M','T','W','T','F','S','S'];
const MN=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const MF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtDay=s=>{const d=parse(s);return DN[dow(s)]+' '+d.getDate()+' '+MN[d.getMonth()]};
const L=ml=>(ml/1000).toFixed(1);
const fr=(a,t)=>t?a+'/'+t:String(a);
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';
const GOAL=3000,SIP=300;

/* ---------- state ---------- */
const EX=[{id:'push',name:'Push-up',v:['Incline','Standard','Diamond'],h:'Plank hold'},
 {id:'pull',name:'Pull-up',v:['Chin-up','Standard','Wide grip'],h:'Dead hang'},
 {id:'dip',name:'Dips',v:['Bench','Parallel bar','Ring'],h:'Support hold'},
 {id:'abs',name:'Abs',v:['Crunch','Leg raise','Bicycle'],h:'Hollow hold'},
 {id:'squat',name:'Squats',v:['Air','Split','Jump'],h:'Wall sit'}];
function defCfg(){return{start:TODAY(),plan:{strength:[0,2,4],easy:[1,5],hard:[3],mind:[0,1,2,3,4,5],salad:[0,1,2,3,4,5,6],sugar:[0,1,2,3,4,5,6]},weighDay:6,sets:2,ex:clone(EX),
 times:{mind:'06:00',strength:'07:00',easy:'07:00',hard:'07:00',salad:'13:00',weigh:'06:30'},dur:{mind:40,strength:45,easy:90,hard:45,salad:30,weigh:20},habits:[],
 water:['07:00','08:30','10:00','11:30','13:00','14:30','16:00','17:30','19:00','20:30'],custom:[],night:20,sound:true,dis:{},t:1}}
function normCfg(c){const d=defCfg();c=Object.assign({},d,c||{});c.plan=Object.assign({},d.plan,c.plan);const ot=c.times||{};c.times=Object.assign({},d.times,ot);if(ot.ride&&!ot.easy){c.times.easy=c.times.hard=ot.ride}delete c.times.ride;c.dur=Object.assign({},d.dur,c.dur);if(!Array.isArray(c.habits))c.habits=[];
 if(!Array.isArray(c.water)||c.water.length!==10)c.water=d.water;if(!Array.isArray(c.custom))c.custom=[];if(!Array.isArray(c.ex)||c.ex.length!==5)c.ex=d.ex;c.dis=c.dis||{};return c}
let S={cfg:defCfg(),weights:{w:{},t:0},months:{}};
const LSK='yearone.v1';
try{const raw=localStorage.getItem(LSK);if(raw){const p=JSON.parse(raw);S.cfg=normCfg(p.cfg);S.weights=p.weights&&p.weights.w?p.weights:S.weights;S.months=p.months||{}}}catch(e){}
const ui={tab:'today',date:TODAY(),peek:null,pv:'week',off:{week:0,month:0},flowDow:dow(TODAY()),extra:{},rideType:{},sheet:null};

/* ---------- persistence: this device first, then the viewer's private Claude store ---------- */
let col=null,sync='local',lastPull=0;const dirty=new Set(),inflight=new Set();let flushT=0;
const getDoc=id=>id==='config'?S.cfg:id==='weights'?S.weights:S.months[id.slice(2)];
function setDoc(id,b){if(id==='config')S.cfg=normCfg(b);else if(id==='weights')S.weights={w:b.w||{},t:b.t||0};else if(id.indexOf('m-')===0)S.months[id.slice(2)]={days:b.days||{},t:b.t||0}}
const allIds=()=>['config','weights'].concat(Object.keys(S.months).map(k=>'m-'+k));
function saveLocal(){try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
function touch(id){const d=getDoc(id);if(d)d.t=Date.now();dirty.add(id);saveLocal();clearTimeout(flushT);flushT=setTimeout(flush,900);ghSchedule()}
function flush(){if(!col)return;dirty.forEach(id=>{if(inflight.has(id))return;const d=getDoc(id);if(!d){dirty.delete(id);return}
  dirty.delete(id);inflight.add(id);
  col.doc(id).set(clone(d)).then(()=>{inflight.delete(id);sync='synced';if(dirty.has(id))flush()},()=>{inflight.delete(id);dirty.add(id);sync='error';clearTimeout(flushT);flushT=setTimeout(flush,20000)})})}
async function pull(){const snap=await col.get();const seen={};let changed=false;
  snap.docs.forEach(d=>{const b=d.data();if(!b)return;seen[d.id]=1;const loc=getDoc(d.id);
    if(!loc||(b.t||0)>(loc.t||0)){setDoc(d.id,clone(b));changed=true}else if((loc.t||0)>(b.t||0))dirty.add(d.id)});
  allIds().forEach(id=>{const d=getDoc(id);if(!seen[id]&&d&&d.t)dirty.add(id)});
  sync='synced';lastPull=Date.now();saveLocal();flush();return changed}
async function initSync(){try{if(!(window.claude&&window.claude.use))return;
  const r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!r[0]||!r[1])return;
  const id=await r[1].id();if(!id)return;col=r[0].collection('data/users/'+id);
  if(await pull())render()}catch(e){sync=col?'error':'local'}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;tick();
  if(col&&!dirty.size&&!inflight.size&&Date.now()-lastPull>60000&&!ui.sheet)pull().then(c=>{if(c)render()},()=>{})});

/* ---------- optional backup + sync to a private GitHub repo (one JSON file, merged per document by timestamp) ---------- */
const GHK='yearone.gh',GHF='dp365.json';let gh=null,ghSha=null,ghState='off',ghMsg='',ghT=0,ghBusy=false,ghAgain=false,ghLast=0,ghPending=false;
try{gh=JSON.parse(localStorage.getItem(GHK)||'null')}catch(e){}
function ghReq(path,opt){opt=opt||{};return fetch('https://api.github.com/repos/'+gh.repo+path,{method:opt.method||'GET',cache:'no-store',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+gh.token,'X-GitHub-Api-Version':'2022-11-28'},body:opt.body})}
const b64e=x=>btoa(unescape(encodeURIComponent(x))),b64d=x=>decodeURIComponent(escape(atob(x.replace(/\s/g,''))));
async function ghPull(){const r=await ghReq('/contents/'+GHF);
  if(r.status===404){ghSha=null;return{changed:false,ahead:true}}
  if(!r.ok)throw{status:r.status};
  const j=await r.json();ghSha=j.sha;if(!j.content)throw{status:0};
  const remote=JSON.parse(b64d(j.content)),Rm={config:remote.cfg,weights:remote.weights};Object.keys(remote.months||{}).forEach(k=>{Rm['m-'+k]=remote.months[k]});
  let changed=false,ahead=false;
  Object.keys(Rm).forEach(id=>{const b=Rm[id];if(!b)return;const loc=getDoc(id);if(!loc||(b.t||0)>(loc.t||0)){setDoc(id,b);changed=true}else if((loc.t||0)>(b.t||0))ahead=true});
  allIds().forEach(id=>{const d=getDoc(id);if(!Rm[id]&&d&&d.t)ahead=true});
  if(changed)saveLocal();return{changed:changed,ahead:ahead}}
function ghFail(e){ghState='error';const st=e&&e.status;ghMsg=st===401?'GitHub no longer accepts the token. Disconnect and connect again with a new one.':(st===403||st===404)?'The token can’t write to that repo.':'Couldn’t reach GitHub. It will retry on your next change.'}
async function ghPush(force){if(!gh)return;if(ghBusy){ghAgain=true;return}ghBusy=true;ghPending=false;ghState='busy';
  try{for(let i=0;i<2;i++){
      if(force&&i===0){const r0=await ghReq('/contents/'+GHF);ghSha=r0.ok?(await r0.json()).sha:null}
      const body={message:'DP365 log '+TODAY(),content:b64e(JSON.stringify(S))};if(ghSha)body.sha=ghSha;
      const r=await ghReq('/contents/'+GHF,{method:'PUT',body:JSON.stringify(body)});
      if(r.ok){ghSha=(await r.json()).content.sha;ghState='ok';ghLast=Date.now();ghMsg='';break}
      if((r.status===409||r.status===422)&&i===0){const m=await ghPull();if(m.changed&&!ui.sheet)render();continue}
      throw{status:r.status}}}
  catch(e){ghFail(e)}
  ghBusy=false;if(ghAgain){ghAgain=false;ghSchedule(500)}}
function ghSchedule(ms){if(!gh)return;ghPending=true;clearTimeout(ghT);ghT=setTimeout(()=>ghPush(),ms||2500)}
async function ghSync(){if(!gh||ghBusy)return;ghState='busy';try{const m=await ghPull();if(m.changed&&!ui.sheet)render();if(m.ahead)await ghPush();else{ghState='ok';ghLast=Date.now();ghMsg=''}}catch(e){ghFail(e)}}
document.addEventListener('visibilitychange',()=>{if(!gh)return;if(document.visibilityState==='visible'){if(Date.now()-ghLast>30000)ghSync()}else if(ghPending){clearTimeout(ghT);ghPush()}});
function ghBlock(){if(col)return'<p>Saved privately to your Claude account. Open Year One on any device and it’s all there.</p>';
  if(gh){const d=new Date(ghLast);return'<div><h4>Backup and sync</h4><p>'+(ghState==='error'?esc(ghMsg):ghState==='busy'?'Syncing with '+esc(gh.repo)+'…':'Backed up to '+esc(gh.repo)+(ghLast?' at '+pad(d.getHours())+':'+pad(d.getMinutes()):'')+'. Every change saves there automatically.')+'</p><div class="rowbtns" style="margin-top:10px"><button class="big soft" data-a="ghOff">Disconnect</button><button class="big ink" data-a="ghNow">Sync now</button></div></div>'}
  const u=/\.github\.io$/.test(location.hostname)?location.hostname.split('.')[0]+'/dp365-data':'';
  return'<div><h4>Backup and sync</h4><p style="margin-bottom:10px">Saved on this device only. Connect a private GitHub repo to back it up and sync it across your devices.</p><div style="display:flex;flex-direction:column;gap:8px"><input class="field" id="gh-repo" placeholder="username/dp365-data" value="'+esc(u)+'" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="GitHub repo, as username/repo"><input class="field" id="gh-token" type="password" placeholder="Paste access token" autocomplete="off" aria-label="GitHub access token"><button class="big ink" data-a="ghOn">Connect</button></div></div>'}

/* ---------- model ---------- */
const getDay=d=>{const m=S.months[d.slice(0,7)];return(m&&m.days[d])||{}};
function mutDay(d,fn){const k=d.slice(0,7),m=S.months[k]||(S.months[k]={days:{},t:0}),o=m.days[d]||(m.days[d]={});fn(o);touch('m-'+k)}
function planFor(d){const w=dow(d),p=S.cfg.plan;return{strength:p.strength.includes(w),ride:p.easy.includes(w)?'easy':p.hard.includes(w)?'hard':null,mind:p.mind.includes(w),weigh:S.cfg.weighDay===w}}
function strFrac(o){const st=o.st||{},n=S.cfg.sets;let s=0;S.cfg.ex.forEach(e=>{s+=Math.min((st[e.id]||[]).length,n)});return s/(S.cfg.ex.length*n)}
const mindFrac=o=>((o.mind&&o.mind.p?1:0)+(o.mind&&o.mind.s?1:0))/2;
function dayParts(d){const p=planFor(d),o=getDay(d),a=[],sf=strFrac(o),mf=mindFrac(o);
  if(p.strength||sf>0)a.push({k:'strength',v:sf});if(p.ride||o.ride)a.push({k:'ride',v:o.ride?1:0});if(p.mind||mf>0)a.push({k:'mind',v:mf});
  a.push({k:'water',v:Math.min((o.water||0)/GOAL,1)});const w=dow(d),pl=S.cfg.plan;if(pl.salad.includes(w)||o.salad)a.push({k:'salad',v:o.salad?1:0});if(pl.sugar.includes(w)||o.sugar)a.push({k:'sugar',v:o.sugar?1:0});
  S.cfg.habits.forEach(x=>{const dn=!!(o.h&&o.h[x.id]);if(x.days.includes(w)||dn)a.push({k:'h:'+x.id,v:dn?1:0})});return a}
function dayScore(d){if(d>TODAY())return null;const m=S.months[d.slice(0,7)];if(d<S.cfg.start&&!(m&&m.days[d]))return null;const a=dayParts(d);return a.reduce((s,x)=>s+x.v,0)/a.length}
function rangeStats(from,to){const r={strength:0,easy:0,hard:0,mind:0,waterDays:0,waterMl:0,salad:0,sugar:0,h:{},T:{strength:0,ride:0,mind:0,daily:0,salad:0,sugar:0,h:{}}},t=TODAY(),hb=S.cfg.habits;hb.forEach(x=>{r.h[x.id]=0;r.T.h[x.id]=0});
  for(let d=from;d<=to;d=addD(d,1)){const w=dow(d);if(d>=S.cfg.start){const p=planFor(d);if(p.strength)r.T.strength++;if(p.ride)r.T.ride++;if(p.mind)r.T.mind++;r.T.daily++;if(S.cfg.plan.salad.includes(w))r.T.salad++;if(S.cfg.plan.sugar.includes(w))r.T.sugar++;hb.forEach(x=>{if(x.days.includes(w))r.T.h[x.id]++})}
    if(d>t)continue;const o=getDay(d);if(strFrac(o)>=1)r.strength++;if(o.ride)r[o.ride.type==='hard'?'hard':'easy']++;if(mindFrac(o)>=1)r.mind++;
    r.waterMl+=o.water||0;if((o.water||0)>=GOAL)r.waterDays++;if(o.salad)r.salad++;if(o.sugar)r.sugar++;hb.forEach(x=>{if(o.h&&o.h[x.id])r.h[x.id]++})}
  r.ride=r.easy+r.hard;
  const rows=[['strength',r.strength,r.T.strength],['ride',r.ride,r.T.ride],['mind',r.mind,r.T.mind],['water',r.waterDays,r.T.daily],['salad',r.salad,r.T.salad],['sugar',r.sugar,r.T.sugar]].concat(hb.map(x=>[x.id,r.h[x.id],r.T.h[x.id]])).filter(x=>x[2]>0);
  r.score=rows.length?rows.reduce((s,x)=>s+Math.min(x[1]/x[2],1),0)/rows.length:0;r.hit=rows.filter(x=>x[1]>=x[2]).length;r.of=rows.length;return r}
const verdict=s=>s>=.85?'Locked in.':s>=.65?'Solid work.':s>=.4?'Keep building.':s>0?'Reset. Go again.':'Blank page.';
const wKeys=()=>Object.keys(S.weights.w).sort();
function wBefore(d){const k=wKeys().filter(x=>x<d);return k.length?S.weights.w[k[k.length-1]]:null}
function wInRange(a,b){const k=wKeys().filter(x=>x>=a&&x<=b);return k.length?S.weights.w[k[k.length-1]]:null}

/* the day's flow: sessions from the plan + sips + own reminders */
function flowItems(w){const c=S.cfg,p=c.plan,a=[];
  if(p.mind.includes(w))a.push({id:'mind',kind:'mind',g:'g-mind',title:'Mindfulness',sub:'Padmasadhana + Sahaj',time:t2m(c.times.mind),dur:c.dur.mind});
  if(p.strength.includes(w))a.push({id:'strength',kind:'strength',g:'g-strength',title:'Strength',sub:'5 moves × '+c.sets+' sets',time:t2m(c.times.strength),dur:c.dur.strength});
  if(p.easy.includes(w))a.push({id:'easy',kind:'ride',g:'g-ride',title:'Long ride',sub:'Long and easy',time:t2m(c.times.easy),dur:c.dur.easy});
  if(p.hard.includes(w))a.push({id:'hard',kind:'ride',g:'g-ride',title:'Fast ride',sub:'Fast and hard',time:t2m(c.times.hard),dur:c.dur.hard});
  if(p.salad.includes(w))a.push({id:'salad',kind:'salad',g:'g-fuel',title:'Salad',sub:'Greens first',time:t2m(c.times.salad),dur:c.dur.salad});
  if(c.weighDay===w)a.push({id:'weigh',kind:'weigh',g:'g-ink',title:'Weigh-in',sub:'Weekly check',time:t2m(c.times.weigh),dur:c.dur.weigh});
  c.custom.forEach(r=>{if(r.days.includes(w))a.push({id:'c:'+r.id,kind:'custom',g:'',title:r.title,sub:'Reminder',time:t2m(r.time),dur:30})});
  c.habits.forEach(x=>{if(x.days.includes(w))a.push({id:'h:'+x.id,kind:'habit',hid:x.id,g:'g-'+x.g,title:x.name,sub:x.dur+' min',time:t2m(x.time),dur:x.dur})});
  a.forEach(i=>i.lane='main');
  c.water.forEach((t,i)=>a.push({id:'w'+i,kind:'water',title:'Drink 300 ml',sub:'Sip '+(i+1)+' of 10',time:t2m(t),dur:0,lane:'sip',i:i}));
  return a.sort((x,y)=>x.time-y.time)}
function setTime(id,m){const t=m2t(m),c=S.cfg;if(id[0]==='w'&&id.length<=2)c.water[+id.slice(1)]=t;else if(id.indexOf('c:')===0){const r=c.custom.find(x=>x.id===id.slice(2));if(r)r.time=t}else if(id.indexOf('h:')===0){const x=c.habits.find(y=>y.id===id.slice(2));if(x)x.time=t}else c.times[id]=t;touch('config')}
function itemDone(it,d){const o=getDay(d);switch(it.kind){case'water':return(o.water||0)>=(it.i+1)*SIP;case'strength':return strFrac(o)>=1;case'ride':return!!o.ride;case'mind':return mindFrac(o)>=1;case'habit':return!!(o.h&&o.h[it.hid]);case'salad':return!!o.salad;case'weigh':return S.weights.w[d]!=null;default:return false}}
function nextUp(d,after){return flowItems(dow(d)).find(i=>i.time>after&&!itemDone(i,d))}
const isNight=()=>new Date().getHours()>=S.cfg.night;

/* ---------- views ---------- */
function ringSvg(p){const c=2*Math.PI*19;return'<svg class="ring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="5"/><circle cx="23" cy="23" r="19" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-p))+'" transform="rotate(-90 23 23)"/></svg>'}
function briefWords(d){const p=planFor(d),w=[];if(p.strength)w.push('Strength');if(p.ride)w.push(p.ride==='easy'?'Long ride':'Fast ride');if(p.mind)w.push('Sit');if(!p.strength&&!p.ride)w.push(p.mind?'Breathe':'Recover');w.push('3 litres');return w}
function briefSub(d){const p=planFor(d),c=S.cfg,a=[];
  if(p.mind)a.push('Padmasadhana + Sahaj at '+c.times.mind);
  if(p.strength)a.push('5 moves × '+c.sets+' sets at '+c.times.strength);
  if(p.ride)a.push((p.ride==='easy'?'Long, easy ride':'Fast, hard ride')+' at '+c.times[p.ride]);c.habits.forEach(x=>{if(x.days.includes(dow(d)))a.push(x.name+' at '+x.time)});
  if(p.weigh)a.push('Weigh-in day');a.push('Salad on the plate, sugar down');return a.join(' · ')+'.'}
function hero(){const t=TODAY(),onToday=ui.date===t,mode=onToday?(ui.peek||(isNight()?'tomorrow':'today')):'day';
  const bd=mode==='tomorrow'?addD(t,1):ui.date,p=planFor(bd);
  const g=mode==='tomorrow'?'g-night':p.strength?'g-strength':p.ride?'g-ride':p.mind?'g-mind':'g-ink';
  const eyebrow=mode==='tomorrow'?'Tomorrow · '+fmtDay(bd):mode==='today'?'Today · '+fmtDay(bd):fmtDay(bd);
  const parts=dayParts(mode==='tomorrow'?t:bd),done=parts.filter(x=>x.v>=1).length,sc=parts.reduce((s,x)=>s+x.v,0)/parts.length;
  let foot;

function shHabit(id){const h=H(id),c=S.cfg;if(!h)return'';const own=!h.bi,isNew=id==='new',sb='class="big soft round" style="height:40px;width:40px"';

  if(!h.noTime)s+='<div><h4>Time</h4><div class="line"><span>Starts at</span><input class="field" type="time" id="h-time" data-h="time" value="'+h.time+'"></div>'+
    '<div class="line"><span>Duration</span><div class="stepper"><button '+sb+' data-a="hDur" data-v="-5" aria-label="5 minutes less">−</button><b style="min-width:92px">'+h.dur+' min</b><button '+sb+' data-a="hDur" data-v="5" aria-label="5 minutes more">+</button></div></div>'+
    '<div class="chips">'+[10,20,30,45,60,90,120].map(m=>'<button class="chip'+(h.dur===m?' on':'')+'" data-a="hDur" data-v="='+m+'">'+m+'<small>min</small></button>').join('')+'</div></div>';
  if(own)s+='<div><h4>Colour</h4><div class="sws">'+['strength','ride','mind','fuel'].map(g=>'<button class="sw g-'+g+(h.g===g?' on':'')+'" data-a="hColor" data-v="'+g+'" aria-label="'+g+' colour" aria-pressed="'+(h.g===g)+'"></button>').join('')+'</div></div>';
  if(id==='easy'||id==='hard')s+='<p>A day holds one ride, so picking a day here frees it from the other ride.</p>';
  if(id==='strength')s+='<div><h4>Sets and moves</h4><div class="line"><span>Sets per move</span><div class="stepper"><button '+sb+' data-a="sets" data-v="-1" aria-label="Fewer sets">−</button><b>'+c.sets+'</b><button '+sb+' data-a="sets" data-v="1" aria-label="More sets">+</button></div></div>'+

  s+='<div class="rowbtns">'+(isNew?'<button class="big soft" data-a="close">Cancel</button><button class="big ink" data-a="hSave">Add habit</button>':(own?'<button class="big soft danger" data-a="hDel">Delete</button>':'')+'<button class="big ink" data-a="close">Done</button>')+'</div>';

   const c=S.cfg;if(draft.id){const i=c.custom.findIndex(x=>x.id===draft.id);if(i>=0)c.custom[i]=draft}else{draft.id=Date.now().toString(36);c.custom.push(draft)}touch('config');draft=null;closeSheet()},

 async ghOn(){const repo=$('#gh-repo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/(\.git)?\/?$/,''),token=$('#gh-token').value.trim();

   try{const r=await ghReq('');if(r.status===401)throw{m:'GitHub didn’t accept that token'};if(!r.ok)throw{m:'That token can’t see '+repo};
     if((await r.json()).private===false)throw{m:'That repo is public. Use a private one.'};
     const m=await ghPull();try{localStorage.setItem(GHK,JSON.stringify(gh))}catch(x){}
     if(m.ahead){await ghPush();if(ghState==='error')throw{m:'The token can’t write. Set Contents to Read and write.'}}else{ghState='ok';ghLast=Date.now()}
     toast('Connected. Your log is backed up.');if(ui.sheet)closeSheet();else render()}
   catch(e){gh=null;try{localStorage.removeItem(GHK)}catch(x){}ghState='off';toast(e.m||((e.status===403||e.status===404)?'The token can’t read that repo’s contents':'Couldn’t reach GitHub. Try again.'));if(ui.sheet)drawSheet()}},

function readDraft(){if(!draft)return;const a=$('#rem-title'),b=$('#rem-time');if(a)draft.title=a.value.trim();if(b&&b.value)draft.time=b.value}
document.addEventListener('click',e=>{unlockAudio();const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f)f(b.dataset.v,b,e)});
document.addEventListener('change',e=>{const el=e.target,c=S.cfg;
  if(el.dataset.ex){const a=el.dataset.ex.split('|'),x=c.ex[+a[0]],v=el.value.trim();if(!v)return;if(a[1]==='n')x.name=v;else if(a[1]==='h')x.h=v;else x.v[+a[1]]=v;touch('config')}

  else if(el.dataset.cfg==='night'){if(el.value){c.night=+el.value.split(':')[0];touch('config')}}

/* ---------- drag on the timeline ---------- */
let dg=null;
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-drag]');if(!el)return;
  const touchy=e.pointerType!=='mouse';if(touchy&&!el.dataset.sip&&!e.target.closest('.grip'))return;
  dg={el:el,id:el.dataset.drag,y:e.pageY,min:+el.dataset.min,cur:+el.dataset.min,moved:false,sip:!!el.dataset.sip};
  try{el.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!dg)return;const dy=e.pageY-dg.y;if(!dg.moved&&Math.abs(dy)<5)return;
  if(!dg.moved){dg.moved=true;dg.el.classList.add('drag')}
  dg.cur=Math.max(F0,Math.min(F1-15,Math.round((dg.min+dy/PX)/5)*5));
  dg.el.style.top=Math.round((dg.cur-F0)*PX-(dg.sip?13:0))+'px';const tm=dg.el.querySelector('.tm');if(tm)tm.textContent=m2t(dg.cur);
  if(e.clientY<90)window.scrollBy(0,-14);else if(e.clientY>window.innerHeight-130)window.scrollBy(0,14)});
function endDrag(e){if(!dg)return;const d=dg;dg=null;if(d.moved){setTime(d.id,d.cur);render()}else if(e.type==='pointerup')openItem(d.id)}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);

let actx=null;function unlockAudio(){if(actx||!S.cfg.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}catch(e){}}
function chime(){if(!actx||!S.cfg.sound)return;try{if(actx.state==='suspended')actx.resume();[880,1318.5].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*.16;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.55)})}catch(e){}}
function firedSet(){const t=TODAY();try{const f=JSON.parse(localStorage.getItem('yearone.fired')||'{}');if(f.d===t)return f}catch(e){}return{d:t,ids:[]}}
function checkReminders(){const t=TODAY(),n=nowMin(),f=firedSet();let hit=null;
  flowItems(dow(t)).forEach(it=>{if(it.time<=n&&n-it.time<=20&&!f.ids.includes(it.id)){f.ids.push(it.id);if(!itemDone(it,t))hit=it}});
  try{localStorage.setItem('yearone.fired',JSON.stringify(f))}catch(e){}
  if(hit){const g=hit.kind==='water'?'g-fuel':(hit.g||'g-ink');
    $('#banHost').innerHTML='<div class="ban" role="alert"><div class="'+g+'"><div class="grow"><small>'+m2t(hit.time)+' · '+esc(hit.sub)+'</small><b>'+esc(hit.title)+'</b></div>'+(hit.kind==='water'?'<button class="big ink" data-a="banDo" data-v="water">Drank it</button>':'')+'<button class="big soft" data-a="banX">'+(hit.kind==='water'?'Later':'Got it')+'</button></div></div>';chime()}}
let lastKey='';
function tick(){const t=TODAY(),key=t+'|'+isNight();
  if(key!==lastKey){const rolled=lastKey&&lastKey.split('|')[0]!==t;lastKey=key;if(rolled){ui.date=t;ui.peek=null}if(!ui.sheet&&!dg)render()}
  else if(ui.tab==='today'&&$('#hero')&&!ui.sheet)$('#hero').innerHTML=hero();
  const nl=$('#nowl');if(nl)nl.style.top=Math.round((nowMin()-F0)*PX)+'px';
  checkReminders()}

saveLocal();render();lastKey=TODAY()+'|'+isNight();checkReminders();setInterval(tick,20000);initSync();if(gh)ghSync();
})();
</script>
